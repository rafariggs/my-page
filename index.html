<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate to Rafa de Cabo</title>
<meta name="description" content="Support Rafa de Cabo with a donation via PayPal, Mercado Pago, Ko-fi or bank transfer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff8ec;
    --ink: #24145c;
    --pink: #ff3d81;
    --yellow: #ffd23f;
    --blue: #2d5bff;
    --mint: #25e0a0;
    --violet: #7b3ff2;
    --radius: 22px;
    --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* floating color blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(2px); z-index: 0; pointer-events: none; }
  .b1 { width: 380px; height: 380px; background: var(--yellow); top: -120px; right: -100px; }
  .b2 { width: 300px; height: 300px; background: var(--mint); bottom: -110px; left: -90px; }
  .b3 { width: 160px; height: 160px; background: var(--pink); top: 45%; left: -60px; opacity: .9; }

  main { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 40px 20px 60px; }

  h1 {
    font-size: clamp(2.6rem, 11vw, 4.4rem);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -.03em;
    text-align: center;
  }
  h1 span { display: inline-block; transition: transform .25s cubic-bezier(.3,1.8,.5,1); cursor: default; }
  h1 span:hover { transform: translateY(-10px) rotate(-6deg); }
  h1 .c0 { color: var(--pink); } h1 .c1 { color: var(--blue); } h1 .c2 { color: var(--violet); }
  h1 .c3 { color: var(--ink); }
  .sub { text-align: center; margin: 16px auto 0; max-width: 34ch; font-size: 1.1rem; }

  /* heart */
  .heart-wrap { display: grid; place-items: center; margin: 26px 0 8px; }
  #heart {
    width: 150px; height: 150px; border: 0; background: none; cursor: pointer;
    transform: scale(var(--s, 1)); transition: transform .35s cubic-bezier(.3,1.7,.5,1);
    filter: drop-shadow(0 8px 0 rgba(36,20,92,.18));
  }
  #heart:active { transform: scale(calc(var(--s, 1) * .9)); }
  #heart:focus-visible { outline: 4px solid var(--blue); outline-offset: 6px; border-radius: 30px; }
  #heart svg { width: 100%; height: 100%; }
  .hint { font-size: .9rem; opacity: .7; text-align: center; }

  /* card */
  .card {
    background: #fff; border: 3px solid var(--ink); border-radius: var(--radius);
    box-shadow: 8px 8px 0 var(--ink); padding: 26px 22px; margin-top: 26px;
  }
  .card h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 14px; }

  .toggle { display: inline-flex; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .toggle button {
    font: inherit; font-weight: 600; border: 0; padding: 8px 18px; cursor: pointer;
    background: #fff; color: var(--ink);
  }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .chip {
    font: inherit; font-weight: 800; font-size: 1.15rem; padding: 14px 0; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 16px; background: var(--cream); color: var(--ink);
    transition: transform .15s, background .15s;
  }
  .chip:hover { transform: translateY(-3px); }
  .chip[aria-pressed="true"] { background: var(--yellow); box-shadow: 0 4px 0 var(--ink); transform: translateY(-3px); }

  .custom { display: flex; align-items: center; gap: 8px; margin-top: 12px; border: 3px solid var(--ink); border-radius: 16px; padding: 4px 14px; }
  .custom label { font-weight: 600; }
  .custom input {
    flex: 1; min-width: 0; font: inherit; font-weight: 800; font-size: 1.2rem; border: 0; outline: 0;
    padding: 10px 0; background: transparent; color: var(--ink);
  }
  .custom:focus-within { border-color: var(--blue); }

  .pay { display: grid; gap: 12px; margin-top: 22px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    font: inherit; font-weight: 800; font-size: 1.1rem; padding: 16px; cursor: pointer; width: 100%;
    color: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(2px); box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible { outline: 4px solid var(--violet); outline-offset: 3px; }
  .paypal { background: var(--blue); }
  .mp { background: #00a8e8; }
  .kofi { background: var(--pink); }
  .bank { background: var(--violet); }
  .tag { font-weight: 600; font-size: .8rem; background: #fff; color: var(--ink); border-radius: 999px; padding: 2px 10px; }

  .bank-box {
    display: none; margin-top: 14px; padding: 16px; border-radius: 16px;
    background: var(--cream); border: 3px dashed var(--ink); font-size: .95rem;
  }
  .bank-box.open { display: block; }
  .bank-box code { display: block; font-weight: 800; font-size: 1.1rem; word-break: break-all; margin: 4px 0 10px; }
  .copy {
    font: inherit; font-weight: 600; background: var(--mint); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 12px; padding: 8px 14px; cursor: pointer;
  }

  footer { text-align: center; margin-top: 30px; font-weight: 600; }

  #confetti { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); z-index: 10;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600;
    transition: transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  #heart svg { animation: beat 1.6s ease-in-out infinite; transform-origin: center; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <h1 id="title" aria-label="Donate to Rafa de Cabo"></h1>
  <p class="sub">Every bit helps. Pick an amount, choose how you want to pay, and say thanks.</p>

  <div class="heart-wrap">
    <button id="heart" aria-label="Tap the heart for confetti">
      <svg viewBox="0 0 100 90" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff3d81"/><stop offset=".55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ffd23f"/>
          </linearGradient>
        </defs>
        <path d="M50 84C20 62 4 46 4 28 4 15 14 6 27 6c9 0 18 5 23 13C55 11 64 6 73 6c13 0 23 9 23 22 0 18-16 34-46 56z"
              fill="url(#g)" stroke="#24145c" stroke-width="4" stroke-linejoin="round"/>
        <path d="M22 26c0-5 4-9 9-9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
      </svg>
    </button>
    <p class="hint">Tap the heart 💛</p>
  </div>

  <section class="card">
    <h2>How much would you like to give?</h2>

    <div class="toggle" role="group" aria-label="Currency">
      <button type="button" data-cur="USD" aria-pressed="true">USD $</button>
      <button type="button" data-cur="MXN" aria-pressed="false">MXN $</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="custom">
      <label for="custom">Other</label>
      <span id="sym">$</span>
      <input id="custom" type="number" inputmode="decimal" min="1" step="1" placeholder="Your amount">
    </div>

    <div class="pay">
      <a class="btn paypal" id="paypal" href="#" target="_blank" rel="noopener">
        Donate with PayPal <span class="tag">International</span>
      </a>
      <a class="btn mp" id="mp" href="#" target="_blank" rel="noopener">
        Pagar con Mercado Pago <span class="tag">México</span>
      </a>
      <a class="btn kofi" id="kofi" href="#" target="_blank" rel="noopener">
        Give on Ko-fi <span class="tag">Card &amp; Apple Pay</span>
      </a>
      <button class="btn bank" id="bankBtn" type="button" aria-expanded="false">
        Bank transfer (SPEI) <span class="tag">México</span>
      </button>
    </div>

    <div class="bank-box" id="bankBox">
      <div>Bank</div><strong id="bankName"></strong>
      <div style="margin-top:8px">CLABE</div><code id="clabe"></code>
      <div>Name</div><strong id="holder"></strong>
      <div style="margin-top:12px"><button class="copy" id="copyBtn" type="button">Copy CLABE</button></div>
    </div>
  </section>

  <footer>Gracias · Thank you · Merci 💖</footer>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
/* ============ EDIT THIS SECTION ============ */
const CONFIG = {
  name: "Donate to Rafa de Cabo",
  paypalUser: "YOUR_PAYPAL_ME_USERNAME",              // paypal.me/YOUR_PAYPAL_ME_USERNAME
  mercadoPagoLink: "https://mpago.la/YOUR_LINK",       // your Mercado Pago payment link
  kofiLink: "https://ko-fi.com/YOUR_KOFI_USERNAME",    // or a Buy Me a Coffee / Patreon link
  bank: { name: "YOUR BANK", clabe: "000000000000000000", holder: "Rafa de Cabo" },
  amounts: { USD: [5, 10, 25, 50], MXN: [100, 200, 500, 1000] }
};
/* ============================================ */

const $ = (id) => document.getElementById(id);
let currency = "USD", amount = 10;

/* Rainbow title */
const words = CONFIG.name.split(" ");
$("title").innerHTML = words.map((w, i) => {
  const cls = "c" + (i > 2 ? 3 : i);
  return `<span class="${cls}" aria-hidden="true">${w}</span>`;
}).join(" ");

/* Chips */
function renderChips() {
  $("chips").innerHTML = CONFIG.amounts[currency]
    .map(a => `<button type="button" class="chip" data-a="${a}" aria-pressed="${a === amount && !$("custom").value}">${a}</button>`).join("");
}
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  $("custom").value = "";
  amount = Number(b.dataset.a);
  update(); burst(e.clientX, e.clientY, 18);
});
$("custom").addEventListener("input", () => {
  const v = parseFloat($("custom").value);
  if (v > 0) amount = v;
  update();
});
document.querySelectorAll(".toggle button").forEach(btn => btn.addEventListener("click", () => {
  currency = btn.dataset.cur;
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", b === btn));
  amount = CONFIG.amounts[currency][1];
  $("custom").value = "";
  update();
}));

/* Update links + heart size */
function update() {
  renderChips();
  $("sym").textContent = currency === "USD" ? "US$" : "MX$";
  const amt = Math.round(amount * 100) / 100;
  $("paypal").href = `https://www.paypal.me/${CONFIG.paypalUser}/${amt}${currency}`;
  $("mp").href = CONFIG.mercadoPagoLink;
  $("kofi").href = CONFIG.kofiLink;
  const usd = currency === "USD" ? amt : amt / 18;   // rough MXN→USD for heart size only
  $("heart").style.setProperty("--s", Math.min(1.35, 0.85 + usd / 150).toFixed(2));
}

/* Bank box */
$("bankName").textContent = CONFIG.bank.name;
$("clabe").textContent = CONFIG.bank.clabe;
$("holder").textContent = CONFIG.bank.holder;
$("bankBtn").addEventListener("click", () => {
  const open = $("bankBox").classList.toggle("open");
  $("bankBtn").setAttribute("aria-expanded", open);
});
$("copyBtn").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(CONFIG.bank.clabe); toast("CLABE copied ✔"); }
  catch { toast("Press and hold to copy"); }
});

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

/* Confetti */
const cv = $("confetti"), ctx = cv.getContext("2d");
let parts = [], raf = null;
const colors = ["#ff3d81", "#ffd23f", "#2d5bff", "#25e0a0", "#7b3ff2"];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();

function burst(x, y, n = 60) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 8;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, w: 6 + Math.random() * 6,
      c: colors[i % colors.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 90 });
  }
  if (!raf) loop();
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : null;
}
$("heart").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 90);
});

update();
</script>
</body>
</html>
